name: weevcrafts

services:
  app:
    image: weevcrafts-app:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WECRATFS_ENV: ${WECRATFS_ENV:-development}
      WECRATFS_ADDR: ":8080"
      DATABASE_URL: postgres://wecratfs:wecratfs@postgres:5432/wecratfs?sslmode=disable
      REDIS_ADDR: redis:6379
      MEILI_ADDR: meilisearch:7700
      S3_ADDR: garage:3900
      S3_ACCESS_KEY: GK0123456789abcdef01234567
      S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_BUCKET: wecratfs-media
      WECRATFS_PUBLIC_URL: ${WECRATFS_PUBLIC_URL:-http://localhost:8080}
      WECRATFS_LOCAL_MODE: "false"
      WECRATFS_NO_PAYMENT_DEMO: "false"
      WECRATFS_PAYMENT_MODE: razorpay
      WECRATFS_SECURE_COOKIES: ${WECRATFS_SECURE_COOKIES:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WECRATFS_SMTP_ADDR: ${WECRATFS_SMTP_ADDR:-}
      WECRATFS_SMTP_USERNAME: ${WECRATFS_SMTP_USERNAME:-}
      WECRATFS_SMTP_PASSWORD: ${WECRATFS_SMTP_PASSWORD:-}
      WECRATFS_SMTP_FROM: ${WECRATFS_SMTP_FROM:-}
      WECRATFS_RESEND_API_KEY_FILE: ${WECRATFS_RESEND_API_KEY_FILE:-}
      WECRATFS_RESEND_FROM: ${WECRATFS_RESEND_FROM:-}
      WECRATFS_RESEND_REPLY_TO: ${WECRATFS_RESEND_REPLY_TO:-}
      WECRATFS_FIREBASE_PROJECT_ID: ${WECRATFS_FIREBASE_PROJECT_ID:-}
      WECRATFS_FIREBASE_API_KEY: ${WECRATFS_FIREBASE_API_KEY:-}
      WECRATFS_FIREBASE_APP_ID: ${WECRATFS_FIREBASE_APP_ID:-}
      WECRATFS_FIREBASE_AUTH_DOMAIN: ${WECRATFS_FIREBASE_AUTH_DOMAIN:-}
      WECRATFS_FIREBASE_SENDER_ID: ${WECRATFS_FIREBASE_SENDER_ID:-}
      WECRATFS_FIREBASE_MEASUREMENT_ID: ${WECRATFS_FIREBASE_MEASUREMENT_ID:-}
      WECRATFS_FIREBASE_VAPID_KEY: ${WECRATFS_FIREBASE_VAPID_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - product_uploads:/app/web/assets/images/uploads
      - firebase_credentials:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wecratfs
      POSTGRES_USER: wecratfs
      POSTGRES_PASSWORD: wecratfs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecratfs -d wecratfs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  garage:
    image: dxflrs/garage:v2.1.0
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage

  garage-init:
    build:
      context: .
      dockerfile: Dockerfile.garage-init
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_ADDR: garage:3901
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    depends_on:
      garage:
        condition: service_started

  mailpit:
    profiles: ["tools"]
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  adminer:
    profiles: ["tools"]
    image: adminer:6.1.1-standalone
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  uptime-kuma:
    profiles: ["tools"]
    image: louislam/uptime-kuma:2.5.5-slim
    restart: unless-stopped
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  uptime-kuma-setup:
    profiles: ["tools"]
    image: louislam/uptime-kuma:2.5.5-slim
    restart: "no"
    command: ["node", "/app/extra/weevcrafts-provision.cjs"]
    environment:
      UPTIME_KUMA_URL: http://uptime-kuma:3001
      UPTIME_KUMA_USERNAME: ${UPTIME_KUMA_USERNAME:-weevcrafts-local}
      UPTIME_KUMA_PASSWORD: ${UPTIME_KUMA_PASSWORD:-}
    volumes:
      - uptime_kuma_data:/app/data
      - ./scripts/provision-uptime-kuma.cjs:/app/extra/weevcrafts-provision.cjs:ro
    depends_on:
      uptime-kuma:
        condition: service_healthy
      app:
        condition: service_healthy
      adminer:
        condition: service_started


volumes:
  product_uploads:
  postgres_data:
  meilisearch_data:
  garage_data:
  uptime_kuma_data:
  firebase_credentials:
    external: true
    name: weevcrafts_firebase_credentials
