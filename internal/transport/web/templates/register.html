{{define "register"}}
<!doctype html>
<html lang="en">
<head><title>{{.Title}}</title>{{template "head" .}}</head>
<body class="bg-paper text-ink" hx-boost="true" hx-target="#page" hx-select="#page" hx-swap="outerHTML" hx-indicator="#page-loading">
  {{template "header" .}}
  <main id="page" class="mx-auto max-w-xl px-5 py-16 lg:px-10">
    <div class="rounded-[2rem] border border-line bg-white p-6 shadow-sm sm:p-10">
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-citrus">Start gently</p>
      <h1 class="mt-3 font-display text-4xl text-indigo">Create your account</h1>
      <p class="mt-3 text-sm leading-6 text-ink/65">We only ask for what is needed to create your customer account.</p>
      {{if .Error}}<div class="mt-6 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">{{.Error}}</div>{{end}}
      <form class="mt-8 grid gap-5" method="post" action="/register">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label class="grid gap-2 text-sm font-semibold" for="display_name">Name<input class="field" id="display_name" name="display_name" autocomplete="name" required value="{{.FormName}}"></label>
        <label class="grid gap-2 text-sm font-semibold" for="email">Email<input class="field" id="email" name="email" type="email" autocomplete="email" required value="{{.FormEmail}}"></label>
        <label class="grid gap-2 text-sm font-semibold" for="password">Password<input class="field" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required><span class="text-xs font-normal text-ink/55">Use at least 12 characters.</span></label>
        <button class="button-primary w-full" type="submit">Create account</button>
      </form>
      <p class="mt-6 text-center text-sm text-ink/65">Already have an account? <a class="font-semibold text-indigo underline" href="/login">Sign in</a></p>
    </div>
  </main>
  {{template "footer" .}}
</body>
</html>
{{end}}
