name: Launch checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: launch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: weevcrafts_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://ci:isolated-ci-only@localhost:5432/weevcrafts_ci?sslmode=disable
      REDIS_ADDR: localhost:6379
      PROJECTION_DATABASE_URL: postgres://ci:isolated-ci-only@localhost:5432/weevcrafts_projections_20261009?sslmode=disable
      FINANCE_DATABASE_URL: postgres://ci:isolated-ci-only@localhost:5432/weevcrafts_finance_20261104?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - run: templ generate -path . -w 2
      - run: npm run assets:images
      - run: npm run css:build
      - run: npm run test:assets
      - name: Verify generated templates
        run: git diff --exit-code -- ':(glob)**/*_templ.go'
      - name: Verify generated assets
        run: git diff --exit-code -- internal/transport/web/static/app.css web/assets web/components/image_variants_generated.go
      - run: bash scripts/check-sqlc-generated.sh
      - run: bash scripts/check-architecture.sh
      - name: Create isolated projection and finance databases
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE weevcrafts_projections_20261009'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE weevcrafts_finance_20261104'
      - run: go vet ./...
      - run: go test -p 1 ./...
      - run: npx playwright install --with-deps chromium
      - name: Verify shopper and seller browser regressions
        run: npx playwright test -c tests/e2e/customer-layout.config.js --project=chromium
      - name: Verify storefront media loading and keyboard controls
        run: npx playwright test -c tests/e2e/storefront-performance.config.js
      - name: Verify product PIN checks and header names
        run: npx playwright test -c tests/e2e/product-delivery.config.js
      - name: Verify shared fulfillment navigation and pilot guidance
        run: npx playwright test -c tests/e2e/fulfillment-navigation.config.js
      - run: npx playwright test -c tests/e2e/finance-controls.config.js
  authenticated-marketplace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: marketplace_policy_test
        ports: ['15465:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['15464:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://ci:isolated-ci-only@127.0.0.1:15465/marketplace_policy_test?sslmode=disable
      MARKETPLACE_UI_FIXTURE_FILE: /tmp/weev-marketplace-fixture.json
      MARKETPLACE_PREVIEW_URL_FILE: /tmp/weev-marketplace-preview-url
      MARKETPLACE_POLICY_UI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed isolated authenticated marketplace
        run: go test ./internal/adapters/postgres -run '^TestMarketplaceBrowserFixture$' -count=1
      - name: Start the real role handlers with isolated services
        run: |
          go test ./internal/web/handlers -run '^TestMarketplaceBrowserPreview$' -count=1 -timeout 40m > /tmp/weev-marketplace-preview.log 2>&1 &
          echo $! > /tmp/weev-marketplace-preview.pid
          for attempt in $(seq 1 180); do
            if [ -s "$MARKETPLACE_PREVIEW_URL_FILE" ] && curl --fail --silent "$(cat "$MARKETPLACE_PREVIEW_URL_FILE")/returns-replacements-authenticity" > /dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/weev-marketplace-preview.pid)" 2>/dev/null; then cat /tmp/weev-marketplace-preview.log; exit 1; fi
            sleep 2
          done
          cat /tmp/weev-marketplace-preview.log
          exit 1
      - name: Verify customer, both sellers and company order integrity
        run: npx playwright test -c tests/e2e/cross-role.config.js
      - name: Stop isolated preview
        if: always()
        run: |
          touch "$MARKETPLACE_PREVIEW_URL_FILE.stop"
          if [ -f /tmp/weev-marketplace-preview.pid ]; then kill "$(cat /tmp/weev-marketplace-preview.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/weev-marketplace-preview.log ]; then cat /tmp/weev-marketplace-preview.log; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authenticated-marketplace-failure
          path: |
            /tmp/weevcrafts-playwright
            /tmp/weev-marketplace-preview.log
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Match local verification; scoped global allowlists require >=8.25.
          GITLEAKS_VERSION: '8.30.1'
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} --label org.opencontainers.image.revision=${{ github.sha }} -t weevcrafts:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: weevcrafts:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
