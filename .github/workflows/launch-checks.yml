name: Launch checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: launch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: weevcrafts_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://ci:isolated-ci-only@localhost:5432/weevcrafts_ci?sslmode=disable
      REDIS_ADDR: localhost:6379
      PROJECTION_DATABASE_URL: postgres://ci:isolated-ci-only@localhost:5432/weevcrafts_projections_20261009?sslmode=disable
      FINANCE_DATABASE_URL: postgres://ci:isolated-ci-only@localhost:5432/weevcrafts_finance_20261104?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - run: templ generate -path . -w 2
      - run: npm run assets:images
      - run: npm run css:build
      - run: npm run test:assets
      - name: Verify generated templates
        run: git diff --exit-code -- ':(glob)**/*_templ.go'
      - name: Verify generated assets
        run: git diff --exit-code -- internal/transport/web/static/app.css web/assets web/components/image_variants_generated.go
      - run: bash scripts/check-sqlc-generated.sh
      - run: bash scripts/check-architecture.sh
      - name: Create isolated projection and finance databases
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE weevcrafts_projections_20261009'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE weevcrafts_finance_20261104'
      - run: go vet ./...
      - run: go test -p 1 ./...
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c tests/e2e/customer-layout.config.js
      - run: npx playwright test -c tests/e2e/finance-controls.config.js
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Match local verification; scoped global allowlists require >=8.25.
          GITLEAKS_VERSION: '8.30.1'
      - run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t weevcrafts:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: weevcrafts:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
