name: Production readiness

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public readiness outside the VPS
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 10 https://weevcrafts.com/health/ready)"
          printf '%s' "$response" | jq --exit-status '.status == "ready"'
