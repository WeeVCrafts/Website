services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      WECRATFS_ENV: development
      WECRATFS_ADDR: ":8080"
      DATABASE_URL: postgres://wecratfs:wecratfs@postgres:5432/wecratfs?sslmode=disable
      REDIS_ADDR: redis:6379
      MEILI_ADDR: meilisearch:7700
      S3_ADDR: minio:9000
      WECRATFS_LOCAL_MODE: "true"
      WECRATFS_PAYMENT_MODE: local
      WECRATFS_LOCAL_PAYMENT_SECRET: wecratfs-local-payment
      WECRATFS_SMTP_ADDR: mailpit:1025
      WECRATFS_SMTP_FROM: demo@weevcrafts.local
    volumes:
      - product_uploads:/app/web/assets/images/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wecratfs
      POSTGRES_USER: wecratfs
      POSTGRES_PASSWORD: wecratfs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecratfs -d wecratfs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wecratfs
      MINIO_ROOT_PASSWORD: wecratfs-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  seed-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.seed
    environment:
      DATABASE_URL: postgres://wecratfs:wecratfs@postgres:5432/wecratfs?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  product_uploads:
  postgres_data:
  meilisearch_data:
  minio_data:
